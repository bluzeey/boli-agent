<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boli Procurement Agent</title>
<style>
:root {
  --bg: #e5ddd5;
  --header: #075e54;
  --header-dark: #054c44;
  --bubble-out: #dcf8c6;
  --bubble-in: #ffffff;
  --panel-bg: #f0f2f5;
  --border: #e9edef;
  --text: #111b21;
  --text-secondary: #667781;
  --link: #027eb5;
  --accent: #25d366;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg);
  background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0z' fill='none'/%3E%3Cpath d='M20 10l2 4 4 2-4 2-2 4-2-4-4-2 4-2z' fill='%23000' fill-opacity='0.02'/%3E%3C/svg%3E");
}
.chat-header {
  background: var(--header);
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.chat-header .avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--header-dark);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600;
}
.chat-header .title { font-size: 15px; font-weight: 600; }
.chat-header .subtitle { font-size: 12px; color: #b3d9d4; }
.chat-header .status-badge {
  margin-left: auto;
  font-size: 11px;
  background: rgba(255,255,255,0.15);
  padding: 4px 10px;
  border-radius: 12px;
  color: #b3d9d4;
}
.chat-header .case-id { font-size: 11px; color: #b3d9d4; margin-top: 2px; }
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.message {
  max-width: 75%;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.4;
  position: relative;
  word-wrap: break-word;
  white-space: pre-wrap;
  box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
}
.message.inbound {
  align-self: flex-start;
  background: var(--bubble-in);
  border-top-left-radius: 0;
}
.message.outbound {
  align-self: flex-end;
  background: var(--bubble-out);
  border-top-right-radius: 0;
}
.message .time {
  font-size: 10px;
  color: var(--text-secondary);
  float: right;
  margin-top: 4px;
  margin-left: 8px;
}
.message .checkmark { font-size: 10px; color: #53bdeb; margin-left: 2px; }
.typing {
  align-self: flex-start;
  background: var(--bubble-in);
  border-top-left-radius: 0;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  display: none;
}
.typing.show { display: block; }
.typing span {
  animation: blink 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
.composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--panel-bg);
  flex-shrink: 0;
}
.composer input {
  flex: 1;
  border: none;
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 14px;
  outline: none;
  background: #fff;
}
.composer input:focus { box-shadow: 0 0 0 2px rgba(7, 94, 84, 0.15); }
.composer button {
  background: var(--header);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: background 0.2s;
}
.composer button:hover { background: var(--header-dark); }
.composer button:disabled { opacity: 0.5; cursor: not-allowed; }
.case-panel {
  width: 320px;
  background: #fff;
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  flex-shrink: 0;
  display: none;
}
.case-panel.show { display: block; }
.case-panel h3 {
  font-size: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  margin-top: 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.case-panel h3:first-child { margin-top: 0; }
.case-panel .field {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.case-panel .field .label { color: var(--text-secondary); }
.case-panel .field .value { font-weight: 500; text-align: right; }
.case-panel .vendor-item {
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.case-panel .vendor-item .name { font-weight: 500; }
.case-panel .vendor-item .meta { font-size: 11px; color: var(--text-secondary); }
.case-panel .rfq-text {
  font-size: 12px;
  background: var(--panel-bg);
  padding: 10px;
  border-radius: 6px;
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
}
.case-panel .doc-text {
  font-size: 12px;
  background: #fffde7;
  padding: 10px;
  border-radius: 6px;
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
}
.case-panel .empty { color: var(--text-secondary); font-size: 13px; font-style: italic; }
.panel-toggle {
  position: fixed;
  bottom: 16px;
  right: 16px;
  background: var(--header);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 48px; height: 48px;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 100;
}
@media (min-width: 900px) {
  .panel-toggle { display: none; }
  .case-panel { display: block; }
}
@media (max-width: 899px) {
  .case-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 85%; max-width: 360px;
    z-index: 200;
    box-shadow: -2px 0 12px rgba(0,0,0,0.15);
  }
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">B</div>
    <div>
      <div class="title">Boli Procurement Agent</div>
      <div class="subtitle" id="status-text">online</div>
      <div class="case-id" id="case-id-text"></div>
    </div>
    <div class="status-badge" id="case-status-badge">Demo</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typing"><span>.</span><span>.</span><span>.</span></div>
  <div class="composer">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" autofocus />
    <button id="send-btn" title="Send">&#9658;</button>
  </div>
</div>

<div class="case-panel" id="case-panel">
  <h3>Case Details</h3>
  <div id="case-details"><div class="empty">No active case</div></div>
  <h3>Vendor Shortlist</h3>
  <div id="vendor-list"><div class="empty">No shortlist yet</div></div>
  <h3>RFQ</h3>
  <div id="rfq-panel"><div class="empty">No RFQ generated</div></div>
  <h3>Vendors &amp; Responses</h3>
  <div id="vendor-responses"><div class="empty">No outreach yet</div></div>
  <h3>Draft Document</h3>
  <div id="doc-panel"><div class="empty">No document generated</div></div>
</div>
<button class="panel-toggle" id="panel-toggle" title="Case details">&#9776;</button>

<script>
const API_BASE = window.location.origin;
let lastMessageId = null;
let polling = false;
let isSending = false;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const typingEl = document.getElementById('typing');
const statusTextEl = document.getElementById('status-text');
const caseIdTextEl = document.getElementById('case-id-text');
const caseStatusBadgeEl = document.getElementById('case-status-badge');
const casePanelEl = document.getElementById('case-panel');
const panelToggleBtn = document.getElementById('panel-toggle');

async function initSession() {
  try {
    const res = await fetch(`${API_BASE}/api/browser-chat/session`, { method: 'POST' });
    const data = await res.json();
    renderTranscript(data);
  } catch (e) {
    console.error('session init failed', e);
  }
  startPolling();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isSending) return;

  isSending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  typingEl.classList.add('show');

  const clientMessageId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

  try {
    const res = await fetch(`${API_BASE}/api/browser-chat/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, client_message_id: clientMessageId }),
    });
    const data = await res.json();
    renderTranscript(data);
    fetchCasePanel(data.active_case_id);
  } catch (e) {
    console.error('send failed', e);
    const errDiv = document.createElement('div');
    errDiv.className = 'message outbound';
    errDiv.textContent = '(Failed to send — retrying)';
    errDiv.style.color = '#c0392b';
    messagesEl.appendChild(errDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    typingEl.classList.remove('show');
    inputEl.focus();
  }
}

async function pollMessages() {
  if (polling) return;
  polling = true;
  try {
    const res = await fetch(`${API_BASE}/api/browser-chat/messages`);
    const data = await res.json();
    renderTranscript(data);
    fetchCasePanel(data.active_case_id);
  } catch (e) {
    // silent poll failure
  } finally {
    polling = false;
  }
}

function startPolling() {
  setInterval(pollMessages, 2000);
}

function renderTranscript(data) {
  if (!data || !data.messages || data.messages.length === 0) {
    if (!lastMessageId) {
      messagesEl.innerHTML = '<div class="message inbound" style="align-self:center;background:rgba(255,255,255,0.7);font-size:13px;">Hi! I am Boli. Describe what you need to source and where, e.g. <b>Find pest control vendors in Jaipur</b></div>';
    }
    return;
  }

  const seen = new Set();
  const existing = messagesEl.querySelectorAll('.message[data-id]');
  existing.forEach(el => seen.add(el.dataset.id));

  let appended = false;
  data.messages.forEach(msg => {
    if (seen.has(msg.id)) return;
    const div = document.createElement('div');
    div.className = `message ${msg.direction}`;
    div.dataset.id = msg.id;
    div.innerHTML = `${escapeHtml(msg.body)}<span class="time">${formatTime(msg.created_at)}</span>${msg.direction === 'outbound' ? '<span class="checkmark">&#10003;&#10003;</span>' : ''}`;
    messagesEl.appendChild(div);
    appended = true;
  });

  if (appended) {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  if (data.active_case_id) {
    caseIdTextEl.textContent = `Case: ${data.active_case_id.slice(0, 8)}...`;
  } else {
    caseIdTextEl.textContent = '';
  }
  if (data.case_status) {
    caseStatusBadgeEl.textContent = data.case_status.replace(/_/g, ' ');
  } else {
    caseStatusBadgeEl.textContent = 'Demo';
  }
}

async function fetchCasePanel(caseId) {
  if (!caseId) return;
  try {
    const [caseRes, candRes] = await Promise.all([
      fetch(`${API_BASE}/api/cases/${caseId}`).then(r => r.ok ? r.json() : null),
      fetch(`${API_BASE}/api/cases/${caseId}/candidates`).then(r => r.ok ? r.json() : []),
    ]);
    renderCaseDetails(caseRes);
    renderVendorList(candRes);
    if (caseRes && (caseRes.status === 'rfq_ready' || caseRes.status === 'outreach_approved' ||
        caseRes.status === 'collecting_responses' || caseRes.status === 'awaiting_approval' ||
        caseRes.status === 'document_ready')) {
      fetchRfq(caseId);
    }
    if (caseRes && (caseRes.status === 'collecting_responses' || caseRes.status === 'awaiting_approval' ||
        caseRes.status === 'document_ready')) {
      fetchVendorResponses(caseId);
    }
    if (caseRes && caseRes.status === 'document_ready') {
      fetchDocument(caseId);
    }
  } catch (e) {
    console.error('case panel fetch failed', e);
  }
}

function renderCaseDetails(caseData) {
  const el = document.getElementById('case-details');
  if (!caseData) {
    el.innerHTML = '<div class="empty">No active case</div>';
    return;
  }
  el.innerHTML = `
    <div class="field"><span class="label">Status</span><span class="value">${caseData.status.replace(/_/g, ' ')}</span></div>
    <div class="field"><span class="label">Need</span><span class="value">${esc(caseData.normalized_need || '-')}</span></div>
    <div class="field"><span class="label">Location</span><span class="value">${esc(caseData.location || '-')}</span></div>
    <div class="field"><span class="label">Type</span><span class="value">${esc(caseData.request_type || '-')}</span></div>
    <div class="field"><span class="label">Budget</span><span class="value">${esc(caseData.budget || '-')}</span></div>
    <div class="field"><span class="label">Quantity</span><span class="value">${esc(caseData.quantity || '-')}</span></div>
    <div class="field"><span class="label">Deadline</span><span class="value">${esc(caseData.deadline || '-')}</span></div>
  `;
}

function renderVendorList(candidates) {
  const el = document.getElementById('vendor-list');
  if (!candidates || candidates.length === 0) {
    el.innerHTML = '<div class="empty">No shortlist yet</div>';
    return;
  }
  el.innerHTML = candidates.map(c => `
    <div class="vendor-item">
      <div class="name">${c.position}. ${esc(c.name)} ${c.selected ? '&#10003;' : ''} ${c.confirmed ? '&#128274;' : ''}</div>
      <div class="meta">${esc(c.phone || 'No phone')} | Rating: ${c.rating || 'N/A'} ${c.expired ? '| <span style="color:#e74c3c">expired</span>' : ''}</div>
    </div>
  `).join('');
}

async function fetchRfq(caseId) {
  try {
    const res = await fetch(`${API_BASE}/api/cases/${caseId}/rfq`);
    if (!res.ok) return;
    const rfq = await res.json();
    const el = document.getElementById('rfq-panel');
    el.innerHTML = `<div class="rfq-text">${escapeHtml(rfq.document_text)}</div>`;
  } catch (e) {}
}

async function fetchVendorResponses(caseId) {
  try {
    const [vRes, rRes] = await Promise.all([
      fetch(`${API_BASE}/api/cases/${caseId}/vendors`).then(r => r.ok ? r.json() : []),
      fetch(`${API_BASE}/api/cases/${caseId}/responses`).then(r => r.ok ? r.json() : []),
    ]);
    const el = document.getElementById('vendor-responses');
    if (!vRes || vRes.length === 0) {
      el.innerHTML = '<div class="empty">No outreach yet</div>';
      return;
    }
    el.innerHTML = vRes.map(v => {
      const resp = rRes.find(r => r.vendor_id === v.id);
      const fields = resp && resp.extracted_fields ? Object.entries(resp.extracted_fields)
        .filter(([k, val]) => val && k !== 'missing').map(([k, val]) => `${k}: ${val}`).join(', ') : '';
      return `<div class="vendor-item">
        <div class="name">${esc(v.name)} ${v.selected_vendor_id === v.id ? '&#127942;' : ''}</div>
        <div class="meta">Outreach: ${esc(v.outreach_status.replace(/_/g, ' '))} | Consent: ${v.contact_consent ? 'Yes' : 'No'}</div>
        ${resp && resp.raw_reply ? `<div class="meta">Reply: ${esc(resp.raw_reply.slice(0, 100))}</div>` : ''}
        ${fields ? `<div class="meta" style="color:#056b00">Quote: ${esc(fields)}</div>` : ''}
      </div>`;
    }).join('');
  } catch (e) {}
}

async function fetchDocument(caseId) {
  try {
    const res = await fetch(`${API_BASE}/api/cases/${caseId}/document`);
    if (!res.ok) return;
    const doc = await res.json();
    const el = document.getElementById('doc-panel');
    el.innerHTML = `<div class="doc-text">${escapeHtml(doc.document)}</div>`;
  } catch (e) {}
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/\n/g, '<br>');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
panelToggleBtn.addEventListener('click', () => {
  casePanelEl.classList.toggle('show');
});

initSession();
</script>
</body>
</html>
